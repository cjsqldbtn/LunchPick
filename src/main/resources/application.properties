# 로컬에 secret.properties가 있으면 읽고,
# Docker처럼 없으면 그냥 넘어감
spring.config.import=optional:classpath:secret.properties

spring.application.name=LunchPick
server.port=8080
server.servlet.context-path=/LunchPick
server.servlet.session.cookie.path=/

# Oracle
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=false

spring.mail.host=smtp.naver.com
spring.mail.port=465

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# ===== Secret 설정 =====
# 환경변수가 있으면 환경변수가 우선 적용됨
kakao.client.id=${KAKAO_CLIENT_ID:${kakao.local.client.id:}}
kakao.client.secret=${KAKAO_CLIENT_SECRET:${kakao.local.client.secret:}}

naver.client.id=${NAVER_CLIENT_ID:${naver.local.client.id:}}
naver.client.secret=${NAVER_CLIENT_SECRET:${naver.local.client.secret:}}

spring.mail.username=${MAIL_USERNAME:${mail.local.username:}}
spring.mail.password=${MAIL_PASSWORD:${mail.local.password:}}

openai.api.key=${OPENAI_API_KEY:${openai.local.api.key:}}